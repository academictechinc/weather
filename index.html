<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>Weather</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#12141a;
    --panel:#191c24;
    --panel-2:#1f2330;
    --line:#2a2f3d;
    --teal:#4fd8c4;
    --amber:#f2a93b;
    --text:#e8eaf0;
    --muted:#8a90a3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
    width:100%;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{width:100%;max-width:520px;margin:0 auto;padding:16px 16px 0;overflow-x:hidden;
       position:relative;z-index:1;}
  #wxCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  #wxTint{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
          transition:opacity 1.2s ease, background 1.2s ease;}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:8px;padding:4px 0 14px;}
  .brand{font-weight:600;font-size:17px;letter-spacing:0.2px;color:var(--muted);
         display:inline-flex;align-items:baseline;flex-shrink:0;}
  .brand b{color:var(--teal);font-size:2.1em;line-height:0;margin-left:1px;}
  .search-wrap{position:relative;flex:1;}
  #locInput{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:'Space Grotesk',sans-serif;font-size:16px;border-radius:10px;padding:11px 12px;
    outline:none;
  }
  #locInput:focus{border-color:var(--teal);}
  #suggestions{
    position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:50;display:none;
  }
  #suggestions div{padding:11px 12px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--line);}
  #suggestions div:last-child{border-bottom:none;}
  #suggestions div:hover, #suggestions div.active{background:var(--panel);color:var(--teal);}
  #suggestions .empty{color:var(--muted);cursor:default;}
  #suggestions .empty:hover{background:none;color:var(--muted);}
  .icon-btn{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .icon-btn:active{border-color:var(--teal);}
  .icon-btn svg{width:18px;height:18px;}

  /* ---------- now card ---------- */
  .now-card{
    background:linear-gradient(165deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;margin-bottom:14px;
  }
  .place-row{display:flex;justify-content:space-between;align-items:baseline;}
  .place-name{font-size:17px;font-weight:600;}
  .place-time{font-size:14px;color:var(--muted);}
  .now-main{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .now-temp{font-size:72px;font-weight:700;line-height:1;letter-spacing:-1px;}
  .now-temp sup{font-size:30px;font-weight:500;color:var(--muted);top:-32px;}
  .now-desc{font-size:16px;color:var(--muted);margin-top:2px;}
  .now-icon{width:74px;height:74px;flex-shrink:0;}
  .stat-row{display:flex;gap:10px;margin-top:14px;}
  .sun-row{display:flex;align-items:flex-end;gap:8px;margin-top:16px;}
  .jeep-card{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:12px 16px;margin-top:14px;display:flex;align-items:center;gap:12px;
  }
  .jeep-svg{width:124px;height:62px;flex-shrink:0;}
  .jeep-text{min-width:0;}
  .jeep-verdict{font-size:16px;font-weight:600;}
  .jeep-why{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
  .sun-arc{flex:1;height:52px;}
  .sun-end{text-align:center;min-width:62px;}
  .sun-t{font-size:14px;font-weight:600;}
  .sun-l{font-size:11px;color:var(--muted);margin-top:2px;}
  #sunDot{filter:drop-shadow(0 0 6px rgba(242,169,59,0.9));}
  .stat{
    flex:1;background:rgba(0,0,0,0.18);border-radius:12px;padding:8px 6px;text-align:center;
  }
  .stat .v{font-size:17px;font-weight:600;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .unit-toggle{
    display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
    font-family:'IBM Plex Mono',monospace;font-size:13px;flex-shrink:0;
  }
  .unit-toggle button{background:none;border:none;color:var(--muted);padding:7px 11px;cursor:pointer;}
  .unit-toggle button.active{background:var(--teal);color:#0b0d12;font-weight:600;}

  /* ---------- section headers ---------- */
  .section-title{font-size:16px;font-weight:600;color:var(--muted);margin:22px 2px 8px;}

  /* ---------- radar ---------- */
  .radar-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
  #radarMap{height:300px;width:100%;background:#0d0e12;}
  .leaflet-container{background:#0d0e12!important;}
  /* Darken the basemap only — the radar pane is untouched so rain stays vivid. */
  /* Leaflet strips "Pane" from the pane name: 'basePane' -> .leaflet-base-pane */
  .leaflet-base-pane{filter:invert(100%) hue-rotate(180deg) brightness(92%) contrast(88%);}
  .radar-bar{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);}
  #playBtn{
    background:var(--teal);border:none;width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  #playBtn svg{width:15px;height:15px;}
  #radarTrack{flex:1;height:4px;background:var(--line);border-radius:4px;position:relative;}
  #radarProgress{position:absolute;top:0;left:0;height:100%;background:var(--teal);border-radius:4px;width:0%;}
  #radarTime{font-size:13px;color:var(--muted);min-width:70px;text-align:right;}
  .radar-foot{
    display:block;text-align:center;color:var(--muted);font-size:13px;text-decoration:none;
    padding:9px 12px;border-top:1px solid var(--line);
  }
  .radar-foot b{color:var(--teal);font-weight:600;}
  .leaflet-control-zoom{border:none!important;box-shadow:none!important;margin:10px!important;}
  .leaflet-control-zoom a{
    background:rgba(25,28,36,0.92)!important;color:var(--text)!important;
    border:1px solid var(--line)!important;width:30px!important;height:30px!important;
    line-height:28px!important;font-size:17px!important;
  }
  .leaflet-control-zoom a:hover{background:var(--panel-2)!important;color:var(--teal)!important;}
  .leaflet-control-attribution{
    background:rgba(18,20,26,0.7)!important;color:var(--muted)!important;
    font-size:9px!important;padding:1px 5px!important;
  }
  .leaflet-control-attribution a{color:var(--muted)!important;}

  /* ---------- hourly ---------- */
  .hourly-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;}
  .hourly-scroll::-webkit-scrollbar{display:none;}
  .hour-card{
    flex:0 0 auto;width:72px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:10px 0 12px;text-align:center;
  }
  .hour-card .t{font-size:13px;color:var(--muted);}
  .hour-card svg{width:30px;height:30px;margin:6px 0;}
  .hour-card .temp{font-size:17px;font-weight:600;}
  .hour-card .pop{font-size:12px;color:var(--teal);margin-top:3px;}

  /* ---------- daily ---------- */
  .day-row{
    display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);
  }
  .day-row:last-child{border-bottom:none;}
  .day-name{width:50px;font-size:15px;font-weight:600;flex-shrink:0;}
  .day-icon{width:32px;height:32px;flex-shrink:0;}
  .day-pop{width:40px;font-size:13px;color:var(--teal);flex-shrink:0;text-align:right;}
  .day-bar-wrap{flex:1;display:flex;align-items:center;gap:8px;}
  .day-lo,.day-hi{font-size:15px;width:34px;flex-shrink:0;}
  .day-lo{color:var(--muted);text-align:right;}
  .day-bar-track{flex:1;height:4px;background:var(--line);border-radius:4px;position:relative;}
  .day-bar-fill{position:absolute;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--amber));}
  .daily-list{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 12px;}

  /* ---------- status / footer ---------- */
  .status{text-align:center;color:var(--muted);font-size:14px;padding:24px 10px;}
  footer{text-align:center;color:var(--line);font-size:11.5px;padding:26px 0 6px;font-family:'IBM Plex Mono',monospace;}

  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<canvas id="wxCanvas"></canvas>
<div id="wxTint"></div>
<div id="app">

  <header>
    <span class="brand">weather<b>.</b></span>
    <div class="search-wrap">
      <input id="locInput" type="text" placeholder="Search city..." autocomplete="off">
      <div id="suggestions"></div>
    </div>
    <button class="icon-btn" id="locBtn" title="Use my location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </header>

  <div class="now-card" id="nowCard">
    <div class="place-row">
      <span class="place-name" id="placeName">–</span>
      <span class="place-time mono" id="placeTime">–</span>
    </div>
    <div class="now-main">
      <div>
        <div class="now-temp" id="nowTemp">–°</div>
        <div class="now-desc" id="nowDesc">Loading conditions…</div>
      </div>
      <svg class="now-icon" id="nowIcon" viewBox="0 0 64 64"></svg>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="v" id="statFeels">–</div><div class="l">Feels like</div></div>
      <div class="stat"><div class="v" id="statHiLo">–</div><div class="l">High / Low</div></div>
      <div class="stat"><div class="v" id="statWind">–</div><div class="l">Wind</div></div>
      <div class="stat"><div class="v" id="statPop">–</div><div class="l">Precip</div></div>
    </div>
    <div class="sun-row">
      <div class="sun-end">
        <div class="sun-t mono" id="sunriseT">–</div>
        <div class="sun-l">Sunrise</div>
      </div>
      <svg class="sun-arc" viewBox="0 0 200 64" preserveAspectRatio="none">
        <path d="M6 58 A 94 52 0 0 1 194 58" fill="none" stroke="#2a2f3d" stroke-width="2.5" stroke-linecap="round"/>
        <path id="sunArcFill" d="M6 58 A 94 52 0 0 1 194 58" fill="none" stroke="#f2a93b"
              stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000"/>
        <circle id="sunDot" cx="6" cy="58" r="5" fill="#f2a93b"/>
      </svg>
      <div class="sun-end">
        <div class="sun-t mono" id="sunsetT">–</div>
        <div class="sun-l">Sunset</div>
      </div>
    </div>
  </div>

  <div class="jeep-card">
    <svg id="jeepSvg" viewBox="0 0 260 130" class="jeep-svg"></svg>
    <div class="jeep-text">
      <div class="jeep-verdict" id="jeepVerdict">–</div>
      <div class="jeep-why" id="jeepWhy">–</div>
    </div>
  </div>

  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
    <span>Radar</span>
    <div class="unit-toggle" id="unitToggle">
      <button data-unit="F" class="active">°F</button><button data-unit="C">°C</button>
    </div>
  </div>
  <div class="radar-card">
    <div id="radarMap"></div>
    <div class="radar-bar">
      <button id="playBtn" aria-label="Play or pause radar loop">
        <svg id="playIcon" viewBox="0 0 24 24" fill="#0b0d12"><polygon points="6,4 20,12 6,20"/></svg>
      </button>
      <div id="radarTrack"><div id="radarProgress"></div></div>
      <span class="mono" id="radarTime">–</span>
    </div>
    <a id="radarLink" class="radar-foot" href="#" target="_blank" rel="noopener">Open full radar <b>&rarr;</b></a>
  </div>

  <div class="section-title">Hourly</div>
  <div class="hourly-scroll" id="hourlyScroll"></div>

  <div class="section-title">10-Day Forecast</div>
  <div class="daily-list" id="dailyList"></div>

  <div class="status" id="statusMsg" style="display:none;"></div>
  <footer>NO ADS · NO TRACKING · OPEN-METEO + RAINVIEWER · BUILD 2026-09-05.29</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){

/* ============ RADAR SOURCE CONFIG ============================================
   Tile layers load as <img> requests, so an API key CANNOT be sent as a header.
   It has to live in the URL. Set the values below and nothing else changes.

   To switch to MyRadar:
     provider: 'custom'
     tileUrl:  paste their template, keep the {z}/{x}/{y} placeholders literal,
               and put the key right in the string.
     maxNative: the deepest zoom their tiles actually exist at (from their docs).

   Example shape (NOT verified — replace with the real one from the docs):
     tileUrl: 'https://api.myradar.dev/tiles/radar/{z}/{x}/{y}.png?key=YOUR_KEY'
============================================================================= */
const RADAR = {
  provider: 'rainviewer',   // 'rainviewer' | 'custom'
  tileUrl:  '',             // used only when provider === 'custom'
  maxNative: 12,            // deepest zoom the provider really serves
  opacity: 0.8
};

/* ============ weather icon set (inline SVG, brand palette) ============ */
const TEAL='#4fd8c4', AMBER='#f2a93b', CLOUD='#9aa1b5', SKY='#3a4058';

function svgSun(cx,cy,r,color){
  let rays='';
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const x1=cx+Math.cos(a)*(r+4), y1=cy+Math.sin(a)*(r+4);
    const x2=cx+Math.cos(a)*(r+10), y2=cy+Math.sin(a)*(r+10);
    rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>${rays}`;
}
function svgMoon(cx,cy,r,color){
  return `<path d="M${cx+r*0.5} ${cy-r} a${r} ${r} 0 1 0 0 ${r*2} a${r*0.75} ${r*0.75} 0 1 1 0 -${r*2}Z" fill="${color}"/>`;
}
function svgCloud(cx,cy,scale,color){
  return `<g transform="translate(${cx} ${cy}) scale(${scale})">
    <path d="M-20 8a12 12 0 0 1 3-23.6A17 17 0 0 1 15.6 -10 12 12 0 0 1 20 14H-20a6 6 0 0 1 0-12z" fill="${color}"/>
  </g>`;
}
function svgRain(cx,cy,color){
  let drops='';
  const xs=[-9,3,15];
  xs.forEach((x,i)=>{ drops+=`<line x1="${cx+x}" y1="${cy+2}" x2="${cx+x-4}" y2="${cy+14}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>`; });
  return drops;
}
function svgSnow(cx,cy,color){
  let flakes='';
  [-9,3,15].forEach(x=>{ flakes+=`<circle cx="${cx+x}" cy="${cy+9}" r="2.2" fill="${color}"/>`; });
  return flakes;
}
function svgBolt(cx,cy,color){
  return `<path d="M${cx+2} ${cy}l-9 13h7l-3 11 10-15h-7Z" fill="${color}"/>`;
}

function weatherIcon(code, isDay, size){
  size = size||64;
  const s = size/64;
  let body='';
  const day = isDay!==false;
  if(code===0){
    body = day ? svgSun(32,26,13,AMBER) : svgMoon(32,24,12,'#c9cde0');
  } else if(code===1||code===2){
    body = (day?svgSun(24,22,10,AMBER):svgMoon(22,20,9,'#c9cde0')) + svgCloud(38,36,0.85,CLOUD);
  } else if(code===3){
    body = svgCloud(32,32,1.1,CLOUD);
  } else if(code===45||code===48){
    body = svgCloud(32,26,0.95,CLOUD) +
      `<line x1="14" y1="42" x2="50" y2="42" stroke="${CLOUD}" stroke-width="3" stroke-linecap="round"/>
       <line x1="18" y1="49" x2="46" y2="49" stroke="${CLOUD}" stroke-width="3" stroke-linecap="round"/>`;
  } else if([51,53,55,56,57,80,81,82].includes(code)){
    body = svgCloud(32,24,0.9,CLOUD) + svgRain(32,32,TEAL);
  } else if([61,63,65,66,67].includes(code)){
    body = svgCloud(32,22,0.95,SKY) + svgRain(28,30,TEAL) + svgRain(40,30,TEAL);
  } else if([71,73,75,77,85,86].includes(code)){
    body = svgCloud(32,24,0.9,CLOUD) + svgSnow(32,32,'#dfe4f2');
  } else if([95,96,99].includes(code)){
    body = svgCloud(32,22,0.95,SKY) + svgBolt(32,34,AMBER);
  } else {
    body = svgCloud(32,32,1.1,CLOUD);
  }
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}">${body}</svg>`;
}

function weatherDesc(code){
  const m = {
    0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',
    45:'Fog',48:'Freezing fog',
    51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',
    56:'Freezing drizzle',57:'Freezing drizzle',
    61:'Light rain',63:'Rain',65:'Heavy rain',
    66:'Freezing rain',67:'Freezing rain',
    71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',
    80:'Rain showers',81:'Rain showers',82:'Violent showers',
    85:'Snow showers',86:'Snow showers',
    95:'Thunderstorm',96:'Thunderstorm + hail',99:'Thunderstorm + hail'
  };
  return m[code] || 'Unknown';
}

/* ============ unit conversion + state ============ */
let unit = localStorage.getItem('wx_unit') || 'F';
let currentData = null;
let map, radarLayers = [], radarIndex = 0, radarTimer = null, radarPlaying = false;

function cToDisplay(c){ return unit==='F' ? Math.round(c*9/5+32) : Math.round(c); }
function kmhToDisplay(kmh){ return unit==='F' ? Math.round(kmh*0.621371) : Math.round(kmh); }
function windUnitLabel(){ return unit==='F' ? 'mph' : 'km/h'; }

/* ============ status helper ============ */
function setStatus(msg){
  const el = document.getElementById('statusMsg');
  if(!msg){ el.style.display='none'; el.textContent=''; return; }
  el.style.display='block'; el.textContent = msg;
}


/* ============ place-name helper ============
   Free reverse geocoders sometimes return an administrative unit in the
   locality field ("District 1", "Ward 3", "Township of X") instead of a town
   name. Reject those and fall back to a real place name. */
function looksAdministrative(s){
  if(!s) return true;
  return /^(district|ward|precinct|township|unorganized|census|division|subdivision|borough of|town of|city of)\b/i.test(s.trim())
      || /\b(district|ward|precinct)\s*\d+/i.test(s)
      || /^\d+$/.test(s.trim());
}

function bestPlaceName(d){
  const candidates = [d.locality, d.city];
  // localityInfo.administrative is ordered broad -> specific; walk it backwards
  // and take the most specific entry that reads like an actual place.
  const admin = (d.localityInfo && d.localityInfo.administrative) || [];
  for(let i = admin.length - 1; i >= 0; i--) candidates.push(admin[i] && admin[i].name);
  const infoPlaces = (d.localityInfo && d.localityInfo.informative) || [];
  for(const p of infoPlaces) candidates.push(p && p.name);

  for(const c of candidates){
    if(c && !looksAdministrative(c)) return c;
  }
  return d.city || d.locality || null;
}

/* ============ geocoding search ============ */
const locInput = document.getElementById('locInput');
const suggestBox = document.getElementById('suggestions');
let searchTimer = null;

locInput.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  const q = locInput.value.trim();
  if(q.length<2){ suggestBox.style.display='none'; return; }
  searchTimer = setTimeout(()=>runSearch(q), 350);
});
locInput.addEventListener('focus', ()=>{ if(suggestBox.childElementCount) suggestBox.style.display='block'; });
document.addEventListener('click', (e)=>{
  if(!suggestBox.contains(e.target) && e.target!==locInput) suggestBox.style.display='none';
});

async function runSearch(q){
  try{
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
    const data = await res.json();
    suggestBox.innerHTML='';
    if(!data.results || !data.results.length){
      suggestBox.innerHTML = '<div class="empty">No matches</div>';
    } else {
      data.results.forEach(r=>{
        const label = [r.name, r.admin1, r.country].filter(Boolean).join(', ');
        const div = document.createElement('div');
        div.textContent = label;
        div.addEventListener('click', ()=>{
          suggestBox.style.display='none';
          locInput.value = label;
          loadLocation(r.latitude, r.longitude, [r.name, r.admin1].filter(Boolean).join(', '));
        });
        suggestBox.appendChild(div);
      });
    }
    suggestBox.style.display='block';
  }catch(e){
    suggestBox.innerHTML = '<div class="empty">Search failed</div>';
    suggestBox.style.display='block';
  }
}

/* ============ geolocation ============ */
document.getElementById('locBtn').addEventListener('click', ()=>{
  if(!navigator.geolocation){ setStatus('Geolocation not supported on this device.'); return; }
  setStatus('Locating…');
  locateAndLoad({onFail: ()=> setStatus('Location access denied — search for a city instead.')});
});

/* ============ unit toggle ============ */
document.getElementById('unitToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  unit = btn.dataset.unit;
  localStorage.setItem('wx_unit', unit);
  document.querySelectorAll('#unitToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  if(currentData) render(currentData);
});
document.querySelectorAll('#unitToggle button').forEach(b=>b.classList.toggle('active', b.dataset.unit===unit));

/* ============ main data load ============ */
async function loadLocation(lat, lon, label){
  setStatus('Loading forecast…');
  localStorage.setItem('wx_lat', lat);
  localStorage.setItem('wx_lon', lon);
  localStorage.setItem('wx_label', label);
  document.getElementById('placeName').textContent = label;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day,precipitation`+
      `&hourly=temperature_2m,precipitation_probability,weather_code,is_day`+
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset`+
      `&timezone=auto&forecast_days=10`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('forecast fetch failed');
    const data = await res.json();
    currentData = data;
    render(data);
    setStatus('');
    updateRadarEmbed(lat, lon, label);
  }catch(e){
    setStatus('Could not load weather data. Check your connection and try again.');
  }
}

/* ============ render ============ */
function render(data){
  const tz = data.timezone;
  const now = new Date();
  document.getElementById('placeTime').textContent = now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) + ' · ' + tz.split('/').pop().replace('_',' ');

  const c = data.current;
  document.getElementById('nowTemp').innerHTML = `${cToDisplay(c.temperature_2m)}<sup>°</sup>`;
  document.getElementById('nowDesc').textContent = weatherDesc(c.weather_code);
  document.getElementById('nowIcon').outerHTML = weatherIcon(c.weather_code, c.is_day===1, 74).replace('<svg ', '<svg id="nowIcon" ');

  document.getElementById('statFeels').textContent = cToDisplay(c.apparent_temperature)+'°';
  document.getElementById('statWind').textContent = kmhToDisplay(c.wind_speed_10m)+' '+windUnitLabel();
  document.getElementById('statPop').textContent = (data.daily.precipitation_probability_max[0] ?? 0)+'%';
  document.getElementById('statHiLo').textContent =
    cToDisplay(data.daily.temperature_2m_max[0])+'° / '+cToDisplay(data.daily.temperature_2m_min[0])+'°';

  renderSun(data);
  updateJeep(data);
  if(window.setAmbient){
    window.setAmbient(c.weather_code, c.is_day === 1, c.temperature_2m);
  }
  renderHourly(data);
  renderDaily(data);
}

function updateJeep(data){
  const c = data.current;
  const tempF = c.temperature_2m * 9/5 + 32;
  const highF = data.daily.temperature_2m_max[0] * 9/5 + 32;

  // Rain within roughly the next 12 hours.
  let popNext = 0, rainSoon = false;
  const nowLocal = (c.time || '').slice(0,13);
  let idx = data.hourly.time.findIndex(t => t.slice(0,13) === nowLocal);
  if(idx < 0) idx = 0;
  for(let i = idx; i < Math.min(idx+12, data.hourly.time.length); i++){
    popNext = Math.max(popNext, data.hourly.precipitation_probability[i] || 0);
    const wc = data.hourly.weather_code[i];
    if([51,53,55,61,63,65,66,67,80,81,82,95,96,99].includes(wc)) rainSoon = true;
  }
  const rainingNow = [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(c.weather_code);
  const snowing = [71,73,75,77,85,86].includes(c.weather_code);

  let state, verdict, why;
  if(tempF < 50 || highF < 58 || snowing){
    state = 'hard';
    verdict = 'Hardtop weather';
    why = snowing ? 'Snow falling — leave it buttoned up.'
                  : `Only ${Math.round(tempF)}° out, high of ${Math.round(highF)}°. Too cold to be open.`;
  } else if(rainingNow){
    state = 'soft';
    verdict = 'Soft top — rain now';
    why = `It's raining. ${popNext}% chance sticking around the next 12 hours.`;
  } else if(rainSoon || popNext >= 40){
    state = 'soft';
    verdict = 'Soft top — rain coming';
    why = `${popNext}% chance within 12 hours. Wouldn't risk it.`;
  } else {
    state = 'open';
    verdict = 'Top off today';
    why = `${Math.round(tempF)}° and only ${popNext}% rain chance. Go for it.`;
  }

  drawJeep(state);
  document.getElementById('jeepVerdict').textContent = verdict;
  document.getElementById('jeepWhy').textContent = why;
}

function renderSun(data){
  const rise = data.daily.sunrise && data.daily.sunrise[0];
  const set  = data.daily.sunset  && data.daily.sunset[0];
  if(!rise || !set) return;

  const hm = s => {
    const h = parseInt(s.slice(11,13),10), m = s.slice(14,16);
    const ap = h < 12 ? 'AM' : 'PM';
    return `${h%12===0?12:h%12}:${m} ${ap}`;
  };
  document.getElementById('sunriseT').textContent = hm(rise);
  document.getElementById('sunsetT').textContent  = hm(set);

  // Progress through daylight, using the location's own clock.
  const mins = s => parseInt(s.slice(11,13),10)*60 + parseInt(s.slice(14,16),10);
  const nowStr = (data.current && data.current.time) || rise;
  const now = mins(nowStr), r = mins(rise), st = mins(set);
  let pct = (now - r) / Math.max(1, st - r);
  pct = Math.min(1, Math.max(0, pct));

  const path = document.getElementById('sunArcFill');
  const len = path.getTotalLength();
  path.setAttribute('stroke-dasharray', len);
  path.setAttribute('stroke-dashoffset', len * (1 - pct));
  const p = path.getPointAtLength(len * pct);
  const dot = document.getElementById('sunDot');
  dot.setAttribute('cx', p.x);
  dot.setAttribute('cy', p.y);
  // Dim the marker outside daylight hours.
  dot.setAttribute('fill', (now < r || now > st) ? '#4a5068' : '#f2a93b');

  // Hand the phase to the background engine.
  window.__wxSun = {rise:r, set:st, now, pct, isDay: now >= r && now <= st};
}

function renderHourly(data){
  const wrap = document.getElementById('hourlyScroll');
  wrap.innerHTML='';
  // Open-Meteo returns hourly times in the LOCATION's local timezone, and
  // current.time in that same timezone. Match against that — using
  // toISOString() here compares UTC to local and lands hours off.
  const nowLocal = (data.current && data.current.time)
    ? data.current.time.slice(0,13)
    : null;
  let startIdx = nowLocal ? data.hourly.time.findIndex(t => t.slice(0,13) === nowLocal) : -1;
  if(startIdx < 0) startIdx = 0;
  for(let i=startIdx; i<Math.min(startIdx+30, data.hourly.time.length); i++){
    // "2026-09-13T19:00" — take the hour from the string itself, in the
    // location's timezone, rather than reparsing through the device clock.
    const hh = parseInt(data.hourly.time[i].slice(11,13), 10);
    const ampm = hh < 12 ? 'AM' : 'PM';
    const h12 = hh % 12 === 0 ? 12 : hh % 12;
    const label = i === startIdx ? 'Now' : `${h12} ${ampm}`;
    const card = document.createElement('div');
    card.className='hour-card';
    card.innerHTML = `
      <div class="t mono">${label}</div>
      ${weatherIcon(data.hourly.weather_code[i], data.hourly.is_day[i]===1, 26)}
      <div class="temp">${cToDisplay(data.hourly.temperature_2m[i])}°</div>
      <div class="pop mono">${data.hourly.precipitation_probability[i]}%</div>
    `;
    wrap.appendChild(card);
  }
}

function renderDaily(data){
  const list = document.getElementById('dailyList');
  list.innerHTML='';
  const allLows = data.daily.temperature_2m_min, allHighs = data.daily.temperature_2m_max;
  const globalLo = Math.min(...allLows), globalHi = Math.max(...allHighs);
  const span = Math.max(1, globalHi-globalLo);

  for(let i=0;i<data.daily.time.length;i++){
    const d = new Date(data.daily.time[i]+'T12:00:00');
    const dayLabel = i===0 ? 'Today' : d.toLocaleDateString([], {weekday:'short'});
    const lo = allLows[i], hi = allHighs[i];
    const leftPct = ((lo-globalLo)/span)*100;
    const widthPct = ((hi-lo)/span)*100;
    const row = document.createElement('div');
    row.className='day-row';
    row.innerHTML = `
      <div class="day-name">${dayLabel}</div>
      ${weatherIcon(data.daily.weather_code[i], true, 28).replace('<svg ', '<svg class="day-icon" ')}
      <div class="day-pop mono">${data.daily.precipitation_probability_max[i]}%</div>
      <div class="day-bar-wrap">
        <div class="day-lo mono">${cToDisplay(lo)}°</div>
        <div class="day-bar-track"><div class="day-bar-fill" style="left:${leftPct}%;width:${widthPct}%;"></div></div>
        <div class="day-hi mono">${cToDisplay(hi)}°</div>
      </div>
    `;
    list.appendChild(row);
  }
}

/* ============ radar ============ */
async function updateRadarEmbed(lat, lon){
  document.getElementById('radarLink').href =
    `https://www.rainviewer.com/map.html?loc=${lat},${lon},7`;

  if(typeof L === 'undefined'){
    document.getElementById('radarTime').textContent = 'offline';
    return;
  }

  if(!map){
    map = L.map('radarMap', {
      zoomControl:true, attributionControl:true,
      // Radar-only. maxNativeZoom below caps what is actually requested from
      // RainViewer; Leaflet upscales past it instead of asking for a zoom
      // the server may not stock.
      minZoom:3, maxZoom:17,
      bounceAtZoomLimits:false
    });
    map.attributionControl.setPrefix(false);
    // Two panes: the CSS filter darkens ONLY the basemap pane, so radar
    // colors render true on top of it.
    map.createPane('basePane');  map.getPane('basePane').style.zIndex  = 200;
    map.createPane('radarPane'); map.getPane('radarPane').style.zIndex = 400;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      pane:'basePane',
      minZoom:3, maxZoom:17, maxNativeZoom:17,
      errorTileUrl:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
      attribution:'&copy; OpenStreetMap'
    }).addTo(map);
  }
  map.setView([lat, lon], 7);

  // Clear the location marker and any previous radar frames.
  radarLayers.forEach(f => { if(map.hasLayer(f.layer)) map.removeLayer(f.layer); });
  radarLayers = [];
  if(radarTimer){ clearInterval(radarTimer); radarTimer = null; radarPlaying = false; updatePlayIcon(); }
  if(window._locDot && map.hasLayer(window._locDot)) map.removeLayer(window._locDot);
  window._locDot = L.circleMarker([lat, lon], {
    radius:6, color:'#f2a93b', fillColor:'#f2a93b', fillOpacity:1, weight:2
  }).addTo(map);

  // --- Custom provider (e.g. MyRadar): one static tile URL, no frame index ---
  if(RADAR.provider === 'custom'){
    if(!RADAR.tileUrl){
      document.getElementById('radarTime').textContent = 'no tile URL set';
      return;
    }
    const layer = L.tileLayer(RADAR.tileUrl, {
      pane:'radarPane', opacity:RADAR.opacity,
      minZoom:3, maxZoom:17, maxNativeZoom:RADAR.maxNative,
      errorTileUrl:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
    }).addTo(map);
    radarLayers = [{layer, time: Date.now()/1000}];
    radarIndex = 0;
    document.getElementById('radarTime').textContent = 'live';
    document.getElementById('radarProgress').style.width = '100%';
    return;
  }

  // --- RainViewer: fetch the frame index, then build one layer per frame ---
  try{
    const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    if(!res.ok) throw new Error('radar index ' + res.status);
    const data = await res.json();
    const frames = [...(data.radar.past || []), ...(data.radar.nowcast || [])];
    if(!frames.length) throw new Error('no frames');

    frames.forEach(f => {
      const layer = L.tileLayer(
        `${data.host}${f.path}/256/{z}/{x}/{y}/3/1_1.png`,
        {
          pane:'radarPane', opacity:RADAR.opacity,
          minZoom:3, maxZoom:17,
          // RainViewer's own map zooms in fully, so their tiles go deeper than
          // I first assumed. Past this, Leaflet upscales instead of requesting
          // a zoom the server may not stock.
          maxNativeZoom:RADAR.maxNative,
          errorTileUrl:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
        }
      );
      radarLayers.push({layer, time:f.time});
    });

    radarIndex = radarLayers.length - 1;
    showRadarFrame(radarIndex);
    playRadar();
  }catch(e){
    // Surface the real reason, not just "unavailable".
    document.getElementById('radarTime').textContent = 'error';
    const foot = document.getElementById('radarLink');
    foot.textContent = 'Radar API: ' + e.message + ' — open full radar →';
  }
}

/* ============ radar playback ============ */
function showRadarFrame(i){
  if(!radarLayers.length) return;
  radarLayers.forEach((f, idx) => {
    if(idx !== i && map.hasLayer(f.layer)) map.removeLayer(f.layer);
  });
  if(!map.hasLayer(radarLayers[i].layer)) radarLayers[i].layer.addTo(map);
  radarIndex = i;
  const t = new Date(radarLayers[i].time * 1000);
  document.getElementById('radarTime').textContent =
    t.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  document.getElementById('radarProgress').style.width =
    (((i + 1) / radarLayers.length) * 100) + '%';
}

function playRadar(){
  if(radarLayers.length < 2) return;
  radarPlaying = true; updatePlayIcon();
  clearInterval(radarTimer);
  radarTimer = setInterval(() => {
    showRadarFrame((radarIndex + 1) % radarLayers.length);
  }, 650);
}

function pauseRadar(){
  radarPlaying = false; updatePlayIcon();
  clearInterval(radarTimer); radarTimer = null;
}

function updatePlayIcon(){
  const icon = document.getElementById('playIcon');
  if(!icon) return;
  icon.innerHTML = radarPlaying
    ? '<rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/>'
    : '<polygon points="6,4 20,12 6,20"/>';
}

document.getElementById('playBtn').addEventListener('click', () => {
  if(!radarLayers.length) return;
  radarPlaying ? pauseRadar() : playRadar();
});


/* ============ ambient background ============
   Canvas particles for precipitation + a sky tint driven by sun position.
   Honors prefers-reduced-motion and pauses when the app is backgrounded. */
(function ambient(){
  const canvas = document.getElementById('wxCanvas');
  const tint = document.getElementById('wxTint');
  if(!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W=0, H=0, dpr=1, particles=[], mode='clear', intensity=1, raf=null, flash=0, nextFlash=0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    build();
  }
  window.addEventListener('resize', resize);

  const rand = (a,b) => a + Math.random()*(b-a);

  function build(){
    particles = [];
    if(mode === 'rain' || mode === 'storm'){
      const n = Math.round((mode==='storm'?150:105) * intensity);
      for(let i=0;i<n;i++) particles.push({
        x:rand(0,W), y:rand(-H,H), len:rand(14,34)*intensity,
        sp:rand(7,15)*intensity, w:rand(0.9,1.9), a:rand(0.22,0.6)
      });
    } else if(mode === 'snow'){
      const n = Math.round(115*intensity);
      for(let i=0;i<n;i++) particles.push({
        x:rand(0,W), y:rand(-H,H), r:rand(1.4,4.2),
        sp:rand(0.5,1.8), sway:rand(0.4,1.8), ph:rand(0,Math.PI*2), a:rand(0.4,0.95)
      });
    } else if(mode === 'heat'){
      for(let i=0;i<40;i++) particles.push({
        x:rand(0,W), y:rand(0,H), r:rand(30,86),
        sp:rand(0.14,0.5), ph:rand(0,Math.PI*2), a:rand(0.05,0.13)
      });
    } else if(mode === 'fog'){
      for(let i=0;i<14;i++) particles.push({
        x:rand(-W*0.3,W), y:rand(0,H), w:rand(W*0.5,W*1.2), h:rand(60,150),
        sp:rand(0.1,0.36), a:rand(0.05,0.11)
      });
    } else if(mode === 'stars'){
      for(let i=0;i<105;i++) particles.push({
        x:rand(0,W), y:rand(0,H*0.8), r:rand(0.6,1.9),
        ph:rand(0,Math.PI*2), tw:rand(0.008,0.035), a:rand(0.4,1)
      });
    } else if(mode === 'cloudy'){
      for(let i=0;i<11;i++) particles.push({
        x:rand(-W*0.2,W), y:rand(0,H*0.8), r:rand(80,175),
        sp:rand(0.06,0.22), a:rand(0.055,0.1)
      });
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    if(mode==='rain' || mode==='storm'){
      ctx.lineCap='round';
      for(const p of particles){
        ctx.strokeStyle = `rgba(170,215,240,${p.a})`;
        ctx.lineWidth = p.w;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.len*0.18, p.y + p.len);
        ctx.stroke();
        p.y += p.sp; p.x -= p.sp*0.18;
        if(p.y > H){ p.y = rand(-60,-5); p.x = rand(0,W); }
      }
      if(mode==='storm'){
        nextFlash--;
        if(nextFlash <= 0){ flash = 1; nextFlash = Math.round(rand(90,300)); }
        if(flash > 0){
          ctx.fillStyle = `rgba(210,228,255,${flash*0.26})`;
          ctx.fillRect(0,0,W,H);
          flash -= 0.06;
        }
      }
    } else if(mode==='snow'){
      for(const p of particles){
        p.ph += 0.01;
        ctx.fillStyle = `rgba(240,246,255,${p.a})`;
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(p.ph)*p.sway*7, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
        p.y += p.sp;
        if(p.y > H+5){ p.y = rand(-40,-5); p.x = rand(0,W); }
      }
    } else if(mode==='heat'){
      for(const p of particles){
        p.ph += 0.012;
        const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
        g.addColorStop(0, `rgba(242,169,59,${p.a})`);
        g.addColorStop(1, 'rgba(242,169,59,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(p.ph)*10, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
        p.y -= p.sp;
        if(p.y < -p.r){ p.y = H + p.r; p.x = rand(0,W); }
      }
    } else if(mode==='fog'){
      for(const p of particles){
        const g = ctx.createLinearGradient(p.x,0,p.x+p.w,0);
        g.addColorStop(0,'rgba(170,180,200,0)');
        g.addColorStop(0.5,`rgba(170,180,200,${p.a})`);
        g.addColorStop(1,'rgba(170,180,200,0)');
        ctx.fillStyle = g;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        p.x += p.sp;
        if(p.x > W){ p.x = -p.w; p.y = rand(0,H); }
      }
    } else if(mode==='stars'){
      for(const p of particles){
        p.ph += p.tw;
        const a = p.a * (0.55 + 0.45*Math.sin(p.ph));
        ctx.fillStyle = `rgba(220,230,255,${a})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      }
    } else if(mode==='cloudy'){
      for(const p of particles){
        const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
        g.addColorStop(0, `rgba(150,160,185,${p.a})`);
        g.addColorStop(1, 'rgba(150,160,185,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        p.x += p.sp;
        if(p.x - p.r > W){ p.x = -p.r; p.y = rand(0,H*0.8); }
      }
    }

    raf = requestAnimationFrame(draw);
  }

  function start(){ if(!raf && !reduced) raf = requestAnimationFrame(draw); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf = null; } }
  document.addEventListener('visibilitychange', ()=> document.hidden ? stop() : start());

  // --- sky tint by sun phase ---
  function skyTint(){
    const s = window.__wxSun;
    if(!s) return 'linear-gradient(180deg, rgba(20,24,34,0.6), rgba(18,20,26,0))';
    const {now, rise, set} = s;
    const dawnA = rise - 45, dawnB = rise + 45;
    const duskA = set - 55,  duskB = set + 50;
    if(now >= dawnA && now <= dawnB)
      return 'linear-gradient(180deg, rgba(255,140,90,0.38), rgba(120,90,160,0.20) 45%, rgba(18,20,26,0))';
    if(now >= duskA && now <= duskB)
      return 'linear-gradient(180deg, rgba(255,110,60,0.44), rgba(150,70,130,0.22) 45%, rgba(18,20,26,0))';
    if(now > dawnB && now < duskA)
      return 'linear-gradient(180deg, rgba(90,160,220,0.24), rgba(18,20,26,0) 58%)';
    return 'linear-gradient(180deg, rgba(25,40,85,0.48), rgba(18,20,26,0) 62%)';
  }

  // --- pick a mode from the weather code ---
  window.setAmbient = function(code, isDay, tempC){
    let m = 'clear', inten = 1;
    if([51,53,55,56,57].includes(code)){ m='rain'; inten=0.55; }
    else if([61,66,80].includes(code)){ m='rain'; inten=0.85; }
    else if([63,81].includes(code)){ m='rain'; inten=1.15; }
    else if([65,67,82].includes(code)){ m='rain'; inten=1.6; }
    else if([95,96,99].includes(code)){ m='storm'; inten=1.5; }
    else if([71,73,75,77,85,86].includes(code)){ m='snow'; inten = code===75?1.5:1; }
    else if([45,48].includes(code)){ m='fog'; }
    else if(code===3){ m='cloudy'; }
    else if([1,2].includes(code)){ m = isDay ? 'clear' : 'stars'; }
    else if(code===0){
      if(!isDay) m='stars';
      else if(typeof tempC === 'number' && tempC >= 32) m='heat';  // ~90F+
      else m='clear';
    }
    if(m !== mode || Math.abs(inten - intensity) > 0.01){
      mode = m; intensity = inten; build();
    }
    tint.style.background = skyTint();
    tint.style.opacity = '1';
    if(mode === 'clear'){ stop(); ctx.clearRect(0,0,W,H); } else start();
  };

  resize();
})();

/* ============ boot ============ */

// Shared geolocation routine: resolve coords -> place name -> load forecast.
function locateAndLoad({onFail} = {}){
  if(!navigator.geolocation){ if(onFail) onFail(); return; }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const {latitude, longitude} = pos.coords;
    let label = 'Current Location';
    try{
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
      const d = await r.json();
      const town = bestPlaceName(d);
      const st = d.principalSubdivisionCode ? (d.principalSubdivisionCode.split('-')[1] || d.principalSubdivision) : d.principalSubdivision;
      label = [town, st].filter(Boolean).join(', ') || label;
    }catch(e){}
    locInput.value = label;
    loadLocation(latitude, longitude, label);
  }, ()=>{ if(onFail) onFail(); },
  {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

(function boot(){
  const savedLat = localStorage.getItem('wx_lat');
  const savedLon = localStorage.getItem('wx_lon');
  const savedLabel = localStorage.getItem('wx_label');

  // Paint the last known location immediately so there is no blank screen,
  // then refresh from GPS every time the app opens.
  if(savedLat && savedLon){
    locInput.value = savedLabel || '';
    loadLocation(parseFloat(savedLat), parseFloat(savedLon), savedLabel || 'Saved location');
    locateAndLoad();   // silent refresh; keeps the saved view if GPS fails
  } else {
    setStatus('Locating…');
    locateAndLoad({onFail: ()=> setStatus('Search for a city to get started.')});
  }
})();

// Re-check location when the app is brought back to the foreground.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') locateAndLoad();
});

// Service worker removed. It was intercepting and caching requests, which
// served stale tiles and could block live API calls. Actively unregister any
// copy still installed from a previous build, and clear its caches.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(r => r.unregister()))
    .catch(()=>{});
}
if(window.caches){
  caches.keys().then(keys => keys.forEach(k => {
    if(k.startsWith('weather-app')) caches.delete(k);
  })).catch(()=>{});
}

})();
</script>
